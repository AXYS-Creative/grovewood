backend:
  # Use netlify identity as backend
  name: git-gateway
  branch: main
  repo: "https://github.com/AXYS-Creative/grovewood.git"
media_folder: src/static/img
public_folder: /static/img
site_url: https://grovewood.netlify.app # On admin login page, this adds a 'go back to site' link. Also added in the corner when logged in.
display_url: https://grovewood.netlify.app # In admin dashboard, this adds the URL in the corner 'View Live'. Used with 'preview_path' for collection viewing.
logo_url: https://grovewood.netlify.app/static/img/icons/admin-logo.svg # On admin login page, this adds a custom logo.

# Please run "npx netlify-cms-proxy-server" for local backend
local_backend: true
# publish_mode: editorial_workflow
partials:
  shared_cta: &cta_field
    name: cta
    label: Call To Action
    widget: object
    summary: "{{ fields.text }} → {{ fields.url }}"
    required: false
    fields:
      - name: text
        label: Button Text
        widget: string
        required: false
        hint: An empty value removes the button
      - name: text_desc
        label: Button Text Description
        widget: string
        required: false
        hint: >
          Some phrases like 'Learn More' or 'Register' are too vague & hurt site metrics. 
          Add more details to enhance SEO & a11y. This won't show on the button.
      - name: url
        label: Button URL
        widget: string
        required: false
        hint: e.g. '/join' or 'axyscreative.com'. To return home use '/'.
      - name: new_tab
        label: Open in a new tab
        widget: boolean
        default: true
  shared_logo: &logo_field
    name: logo
    label: Logo
    widget: object
    summary: "Site Logo"
    required: false
    fields:
      - name: src_light
        label: Image Source (Light Theme)
        widget: image
        required: false
        hint: An empty value removes the logo
      - name: src_dark
        label: Image Source (Dark Theme)
        widget: image
        required: false
        hint: An empty value removes the logo
      - name: text
        label: Text
        widget: string
        required: false
        hint: Optional image description for SEO and accessibility.
      - name: url
        label: Button URL
        widget: string
        required: false
        hint: Include a url to make the logo a link. To return home use '/'.
      - name: new_tab
        label: Open in a new tab
        widget: boolean
        default: true
        hint: If the logo is a link, this toggles opening in a new tab.
  shared_header_cta: &header_cta_fields
    - {
        name: text,
        label: Button Text,
        widget: string,
        required: false,
        hint: An empty value removes the button.,
      }
    - {
        name: text_desc,
        label: Accessible Description,
        widget: string,
        required: false,
        hint: "Used by screen readers when the visible label is vague (e.g. 'Log In'). This won't show on the button.",
      }
    - {
        name: url,
        label: Button URL,
        widget: string,
        required: false,
        hint: "e.g. '/contact' or 'tel:8017854622'. To return home use '/'.",
      }
    - { name: new_tab, label: Open in a new tab, widget: boolean, default: true }
    - {
        name: type,
        label: Button Type,
        widget: select,
        options: ["text", "underline", "primary", "secondary"],
        default: "text",
        multiple: false,
        create: false,
        required: false,
      }
    - { name: icon_start, label: Start Icon, widget: image, required: false }
    - { name: icon_end, label: End Icon, widget: image, required: false }
    - {
        name: class,
        label: CSS Class,
        widget: hidden,
        default: "btn--split-text",
      }
  shared_section_cta: &section_cta_fields
    - {
        name: text,
        label: Button Text,
        widget: string,
        required: false,
        hint: An empty value removes the button.,
      }
    - {
        name: text_desc,
        label: Accessible Description,
        widget: string,
        required: false,
        hint: "Used by screen readers when the visible label is vague. This won't show on the button.",
      }
    - {
        name: url,
        label: Button URL,
        widget: string,
        required: false,
        hint: "e.g. '/contact' or 'tel:8017854622'. To return home use '/'.",
      }
    - { name: new_tab, label: Open in a new tab, widget: boolean, default: false }
    - {
        name: type,
        label: Button Type,
        widget: select,
        options: ["primary", "secondary", "text", "underline"],
        default: "primary",
        multiple: false,
        create: false,
        required: false,
      }
    - { name: icon_start, label: Start Icon, widget: image, required: false }
    - { name: icon_end, label: End Icon, widget: image, required: false }
  shared_footer_contact: &footer_contact_fields
    - {
        name: text,
        label: Text,
        widget: string,
        required: false,
        hint: "Use [%br%] to force a line break.",
      }
    - { name: url, label: URL, widget: string, required: false }
    - {
        name: new_tab,
        label: Open in a new tab,
        widget: boolean,
        default: false,
      }
    - {
        name: type,
        label: Button Type,
        widget: select,
        options: ["text", "underline", "primary", "secondary"],
        default: "text",
        multiple: false,
        create: false,
        required: false,
      }
    - {
        name: class,
        label: CSS Class,
        widget: hidden,
        default: "footer-simple__top-contact-link",
      }
  shared_footer_linkset: &footer_linkset_fields
    - { name: text, label: Text, widget: string, required: true }
    - { name: url, label: URL, widget: string, required: true }
    - {
        name: new_tab,
        label: Open in a new tab,
        widget: boolean,
        default: false,
      }
    - {
        name: type,
        label: Button Type,
        widget: select,
        options: ["text", "underline", "primary", "secondary"],
        default: "text",
        multiple: false,
        create: false,
        required: false,
      }
    - {
        name: class,
        label: CSS Class,
        widget: hidden,
        default: "btn--split-text",
      }
collections:
  - name: blog
    label: Blog
    folder: src/posts/blog
    preview_path: posts/blog/{{filename}}/
    create: true
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: Description,
          name: description,
          widget: string,
          hint: Keep descriptions concise (under ~155 characters) so search engines don't truncate them.,
        }
      - { label: Author, name: author, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Body, name: body, widget: markdown }
      - widget: select
        label: tags
        name: tags
        multiple: false
        create: false
        options: [Press Release, Update, Best Practices, Announcement, Event]
      - label: Cover Image # Only seems to work with .md collections
        name: cover_image
        widget: "image"
        required: false
  - name: page_home
    label: Page - Home
    description: >
      (Optional) Home Page Description
    files:
      - name: home_hero
        label: Section - Hero
        file: src/_data/page_home/home_hero.yaml
        preview_path: "/#{{fields.section_id}}"
        editor:
          preview: true
        fields:
          - name: eyebrow
            label: Eyebrow
            widget: string
            required: false
            hint: Small line of text shown above the title.
          - name: title
            label: Title
            widget: string
            required: true
          - name: desc
            label: Description
            widget: text
            required: false
          - name: direction
            label: Layout Direction
            widget: select
            options: ["row", "column"]
            default: "row"
            multiple: false
            required: false
            hint: "'row' places the image beside the text; 'column' stacks them."
          - name: cta_1
            label: Primary Call To Action
            widget: object
            summary: "{{ fields.text }} → {{ fields.url }}"
            required: false
            fields: *section_cta_fields
          - name: cta_2
            label: Secondary Call To Action
            widget: object
            summary: "{{ fields.text }} → {{ fields.url }}"
            required: false
            fields: *section_cta_fields
          - name: extra_hero_img
            label: Hero Image
            widget: object
            required: false
            hint: Shown beside the text. Remove the source to hide the image.
            fields:
              - { name: src, label: Image Source, widget: image, required: false }
              - {
                  name: alt,
                  label: Alt Text,
                  widget: string,
                  required: false,
                  hint: "Leave blank if the image is decorative.",
                }
          - {
              name: section_id,
              label: Section ID,
              widget: hidden,
              default: "home-hero",
            }
      - name: home_text_stack
        label: Section - Text Stack
        file: src/_data/page_home/home_text_stack.yaml
        preview_path: "/#{{fields.section_id}}"
        editor:
          preview: true
        fields:
          - name: eyebrow
            label: Eyebrow
            widget: string
            required: false
            hint: Small line of text shown above the title.
          - name: title
            label: Title
            widget: string
            required: false
          - name: desc
            label: Description
            widget: text
            required: false
          - name: cta_1
            label: Primary Call To Action
            widget: object
            summary: "{{ fields.text }} → {{ fields.url }}"
            required: false
            fields: *section_cta_fields
          - name: cta_2
            label: Secondary Call To Action
            widget: object
            summary: "{{ fields.text }} → {{ fields.url }}"
            required: false
            fields: *section_cta_fields
          - {
              name: class,
              label: CSS Class,
              widget: hidden,
              default: "home-text-stack",
            }
          - {
              name: section_id,
              label: Section ID,
              widget: hidden,
              default: "home-text-stack",
            }
      - name: home_image_grid
        label: Section - Image Grid
        file: src/_data/page_home/home_image_grid.yaml
        preview_path: "/#{{fields.section_id}}"
        editor:
          preview: true
        fields:
          - name: eyebrow
            label: Eyebrow
            widget: string
            required: false
            hint: Small line of text shown above the title.
          - name: title
            label: Title
            widget: string
            required: false
          - name: desc
            label: Description
            widget: text
            required: false
            hint: "Use [%br%] to force a line break."
          - name: images
            label: Images
            label_singular: Image
            widget: list
            required: false
            summary: "{{ fields.alt }}"
            fields:
              - { name: src, label: Image Source, widget: image, required: true }
              - {
                  name: alt,
                  label: Alt Text,
                  widget: string,
                  required: false,
                  hint: "Leave blank if the image is decorative.",
                }
          - {
              name: section_id,
              label: Section ID,
              widget: hidden,
              default: "home-image-grid",
            }
      - name: home_text_invite
        label: Section - Text Invite
        file: src/_data/page_home/home_text_invite.yaml
        preview_path: "/#{{fields.section_id}}"
        editor:
          preview: true
        fields:
          - name: eyebrow
            label: Eyebrow
            widget: string
            required: false
            hint: Small line of text shown above the title.
          - name: title
            label: Title
            widget: string
            required: false
          - name: desc
            label: Description
            widget: text
            required: false
          - name: cta_1
            label: Primary Call To Action
            widget: object
            summary: "{{ fields.text }} → {{ fields.url }}"
            required: false
            fields: *section_cta_fields
          - name: cta_2
            label: Secondary Call To Action
            widget: object
            summary: "{{ fields.text }} → {{ fields.url }}"
            required: false
            fields: *section_cta_fields
          - {
              name: class,
              label: CSS Class,
              widget: hidden,
              default: "home-text-invite",
            }
          - {
              name: section_id,
              label: Section ID,
              widget: hidden,
              default: "home-text-invite",
            }
      - name: home_testimonial_carousel
        label: Section - Testimonial Carousel
        file: src/_data/page_home/home_testimonial_carousel.yaml
        preview_path: "/#{{fields.section_id}}"
        editor:
          preview: true
        fields:
          - name: eyebrow
            label: Eyebrow
            widget: string
            required: false
            hint: Small line of text shown above the title.
          - name: title
            label: Title
            widget: string
            required: false
          - name: carousel
            label: Carousel
            widget: object
            required: false
            fields:
              - name: pagination
                label: Pagination Style
                widget: select
                options: ["arrows", "dots", "none"]
                default: "arrows"
                multiple: false
                required: false
              - name: drag
                label: Allow Click / Touch Drag
                widget: boolean
                default: true
                required: false
              - name: slides
                label: Slides
                label_singular: Slide
                widget: list
                required: false
                summary: "{{ fields.name }}"
                fields:
                  - {
                      name: quote,
                      label: Quote,
                      widget: text,
                      required: true,
                    }
                  - {
                      name: name,
                      label: Name,
                      widget: string,
                      required: false,
                    }
                  - {
                      name: title,
                      label: Title / Role,
                      widget: string,
                      required: false,
                    }
                  - name: img
                    label: Portrait
                    widget: object
                    required: false
                    fields:
                      - {
                          name: src,
                          label: Image Source,
                          widget: image,
                          required: false,
                        }
                      - {
                          name: alt,
                          label: Alt Text,
                          widget: string,
                          required: false,
                          hint: "Leave blank if the image is decorative.",
                        }
          - {
              name: class,
              label: CSS Class,
              widget: hidden,
              default: "home-testimonials",
            }
          - {
              name: section_id,
              label: Section ID,
              widget: hidden,
              default: "home-testimonials",
            }
      - name: home_stats
        label: Section - Stats
        file: src/_data/page_home/home_stats.yaml
        preview_path: "/#{{fields.section_id}}"
        editor:
          preview: true
        fields:
          - name: eyebrow
            label: Eyebrow
            widget: string
            required: false
            hint: Small line of text shown above the title.
          - name: title
            label: Title
            widget: string
            required: false
          - name: desc
            label: Description
            widget: text
            required: false
          - name: stats
            label: Stats
            label_singular: Stat
            widget: list
            required: false
            summary: "{{ fields.digit }}{{ fields.suffix }} — {{ fields.label }}"
            fields:
              - {
                  name: digit,
                  label: Number,
                  widget: number,
                  value_type: int,
                  required: true,
                }
              - {
                  name: suffix,
                  label: Suffix,
                  widget: string,
                  required: false,
                  hint: "e.g. 'k+', '%', '+'.",
                }
              - {
                  name: label,
                  label: Label,
                  widget: string,
                  required: false,
                }
              - {
                  name: spoken_label,
                  label: Screen Reader Label,
                  widget: string,
                  required: false,
                  hint: "Full sentence read aloud in place of the number, e.g. 'Over 15 thousand in monthly revenue'.",
                }
              - {
                  name: ticker,
                  label: Ticker Animation,
                  widget: hidden,
                  default: true,
                }
              - {
                  name: class,
                  label: CSS Class,
                  widget: hidden,
                  default: "home-stats__counter",
                }
          - {
              name: class,
              label: CSS Class,
              widget: hidden,
              default: "home-stats",
            }
          - {
              name: section_id,
              label: Section ID,
              widget: hidden,
              default: "home-stats",
            }
  - name: page_library
    label: Page - Library
    description: >
      Library for all UI components
    files:
      - name: marquee
        label: Marquee
        file: src/_data/library/marquee.yaml
        preview_path: /
        editor:
          preview: false
        fields:
          - name: marquee
            label: Marquee Data
            widget: object
            required: false
            fields:
              - name: text
                label: Marquee Text
                widget: string
                required: true
                hint: Keep your message at least 64 characters long.
              - name: imgs
                label: Marquee Images
                label_singular: Image
                widget: list
                min: 5
                max: 999 # max value is required to use 'min'
                hint: Include a minimum of 5 images.
                required: false
                fields:
                  - name: src
                    label: Image Source
                    widget: image
                    required: true
                  - name: alt
                    label: Image Alt Text
                    widget: string
                    required: true
              - name: scrub
                label: Marquee Scrub
                widget: boolean
                hint: Change velocity based on user scroll.
      - name: accordion
        label: Accordion
        file: src/_data/library.accordion.yaml
        preview_path: /
        editor:
          preview: false
        fields:
          - name: "accordion_behavior_single"
            label: "Single Open"
            widget: "boolean"
            required: false
            hint: "Allow only one item to be open at a time."
          - name: "accordion_data"
            label: "accordion Items"
            label_singular: "Item"
            widget: "list"
            fields:
              - name: "title"
                label: "Title"
                widget: "string"
                required: true
              - name: "content"
                label: "Content"
                widget: "text"
                required: true
      - name: "carousel_swiper"
        label: "Swiper Carousel"
        file: "src/_data/library/carousel_swiper.yaml"
        preview_path: "/library#carousel-swiper"
        editor:
          preview: false
        fields:
          - name: "autoplay"
            label: "Autoplay"
            widget: "object"
            summary: "{{fields.enabled}}, {{fields.interval}}"
            fields:
              - name: "enabled"
                label: "Enabled"
                widget: "boolean"
                hint: "Autoplay carousel"
              - name: "interval"
                label: "Interval"
                widget: "number"
                hint: "i.e. 5000 — Interval in milliseconds. Not recommended below 2000"
              - name: "allow_user_toggle"
                label: "Allow User Toggle"
                widget: "boolean"
                hint: "Allow users to toggle autoplay"
          - name: "slides"
            label: "Carousel Slides"
            label_singular: "Slide"
            widget: "list"
            fields:
              - name: "title"
                label: "Title"
                widget: "string"
                required: true
              - name: "description"
                label: "Description"
                widget: "text"
                required: true
              - name: "image"
                label: "Image"
                widget: "image"
      - name: "tabs"
        label: "Tabs"
        file: "src/_data/library/tabs.yaml"
        preview_path: "/library#tabs"
        editor:
          preview: false
        fields:
          - name: "tabs"
            label: "Tabs"
            label_singular: "Tab"
            widget: "list"
            fields:
              - name: "title"
                label: "Title"
                widget: "string"
                required: true
              - name: "desc"
                label: "Description"
                widget: "text"
                required: true
              - name: "img"
                label: "Image"
                widget: "image"
  - name: page_404
    label: Page - 404 (Error)
    description: >-
      A 404 page is shown to visitors when they try to access a page that doesn’t exist
      on your site—either because the URL was mistyped, the page was removed, or it was
      never created. You can customize this page to help guide users back to working content.
    files:
      - name: hero_error
        label: Section - Hero
        file: src/_data/page_404/hero_error.yaml
        preview_path: /blog
        editor:
          preview: true
        fields:
          - name: section_title
            label: Section Title
            widget: string
            required: true
          - name: section_desc
            label: Section Description
            widget: text
            required: true
          - name: cta_1
            label: Call To Action 1
            widget: object
            summary: "{{ fields.text }} → {{ fields.url }}"
            required: false
            fields:
              - name: text
                label: Button Text
                widget: string
                required: false
                hint: An empty value removes the button
              - name: text_desc
                label: Button Text Description
                widget: string
                required: false
                hint: "'Learn More' is too vague and hurts SEO. Add more details to enhance the site."
              - name: url
                label: Button URL
                widget: string
                required: false
                hint: "To return home use: /"
              - name: new_tab
                label: Open in a new tab
                widget: boolean
                default: true
          - name: cta_2
            label: Call To Action 2
            widget: object
            summary: "{{ fields.text }} → {{ fields.url }}"
            required: false
            fields:
              - name: text
                label: Button Text
                widget: string
                required: false
                hint: An empty value removes the button
              - name: text_desc
                label: Button Text Description
                widget: string
                required: false
                hint: "'Learn More' is too vague and hurts SEO. Add more details to enhance the site."
              - name: url
                label: Button URL
                widget: string
                required: false
              - name: new_tab
                label: Open in a new tab
                widget: boolean
                default: true
  - name: global
    label: Global
    description: >
      Global components used throughout the site. These elements are shared across multiple pages and help maintain consistency in layout and branding.
    files:
      - name: header_simple
        label: Site Header
        file: src/_data/global/header_simple.yaml
        editor:
          preview: true
        fields:
          - name: show_skip_to_content
            label: Show "Skip to Content" Link
            widget: boolean
            default: true
            required: false
            hint: >
              Accessibility link that lets keyboard users jump straight to the
              main content, skipping the header.
          - name: logo
            label: Show Logo
            widget: boolean
            default: true
            required: false
            hint: The logo image and link are managed in the Logo file.
          - name: menu_links
            label: Menu Links
            label_singular: Link
            widget: list
            required: false
            summary: "{{ fields.text }}"
            fields:
              - { name: text, label: Text, widget: string, required: true }
              - {
                  name: url,
                  label: URL,
                  widget: string,
                  required: false,
                  hint: Leave blank if this item only opens a dropdown.,
                }
              - {
                  name: path,
                  label: Active Path,
                  widget: string,
                  required: false,
                  hint: "Page slug used to highlight the current link, e.g. 'team'.",
                }
              - {
                  name: new_tab,
                  label: Open in a new tab,
                  widget: boolean,
                  default: false,
                }
              - {
                  name: type,
                  label: Button Type,
                  widget: select,
                  options: ["text", "underline", "primary", "secondary"],
                  default: "text",
                  multiple: false,
                  create: false,
                  required: false,
                }
              - {
                  name: icon_start,
                  label: Start Icon,
                  widget: image,
                  required: false,
                }
              - {
                  name: class,
                  label: CSS Class,
                  widget: hidden,
                  default: "menu-links__link btn--split-text",
                }
              - name: trigger_text_class
                label: Trigger Text Class
                widget: hidden
                default: "menu-links__link btn--split-text btn--text"
              - name: icon
                label: Dropdown Icon
                widget: image
                required: false
                hint: Indicator (e.g. a chevron) shown when this item has sub-links.
              - name: inner_links
                label: Sub Links
                label_singular: Sub Link
                widget: list
                required: false
                summary: "{{ fields.text }}"
                fields:
                  - { name: text, label: Text, widget: string, required: true }
                  - { name: url, label: URL, widget: string, required: true }
                  - {
                      name: path,
                      label: Active Path,
                      widget: string,
                      required: false,
                      hint: "Page slug used to highlight the current link.",
                    }
                  - {
                      name: new_tab,
                      label: Open in a new tab,
                      widget: boolean,
                      default: false,
                    }
                  - {
                      name: type,
                      label: Button Type,
                      widget: select,
                      options: ["text", "underline", "primary", "secondary"],
                      default: "text",
                      multiple: false,
                      create: false,
                      required: false,
                    }
                  - {
                      name: icon_start,
                      label: Start Icon,
                      widget: image,
                      required: false,
                    }
                  - {
                      name: class,
                      label: CSS Class,
                      widget: hidden,
                      default: "btn--split-text",
                    }
          - name: link_placement
            label: Link Placement
            widget: select
            options: ["start", "center", "end"]
            default: "center"
            multiple: false
            required: false
            hint: Horizontal position of the menu links within the header.
          - name: cta_1
            label: Primary Call To Action
            widget: object
            summary: "{{ fields.text }} → {{ fields.url }}"
            required: false
            fields: *header_cta_fields
          - name: cta_2
            label: Secondary Call To Action
            widget: object
            summary: "{{ fields.text }} → {{ fields.url }}"
            required: false
            fields: *header_cta_fields
          - name: lock_body_scroll
            label: Lock Page Scroll When Menu Is Open
            widget: boolean
            default: true
            required: false
            hint: Stops the page behind the mobile menu from scrolling.
          - name: nav_btn
            label: Mobile Menu Button
            widget: object
            required: false
            fields:
              - name: text
                label: Button Text
                widget: string
                required: false
                hint: Optional label shown next to the icon.
              - name: symbol
                label: Icon Style
                widget: select
                multiple: false
                required: false
                default: burger
                options: [burger, chocolate, kebab]
              - name: shape
                label: Icon Shape
                widget: select
                multiple: false
                required: false
                default: square
                options: [square, round]
          - name: nav_footer
            label: Mobile Menu Footer
            widget: object
            required: false
            fields:
              - name: links
                label: Links
                label_singular: Link
                widget: list
                required: false
                fields:
                  - { name: text, label: Text, widget: string, required: true }
                  - { name: url, label: URL, widget: string, required: true }
                  - {
                      name: new_tab,
                      label: Open in a new tab,
                      widget: boolean,
                      default: false,
                    }
              - name: social_media
                label: Show Social Media Links
                widget: boolean
                default: true
                required: false
              - name: admin_login
                label: Show Admin Login Link
