                widget: list
                required: false
                summary: "{{ fields.text }}"
                fields:
                  - { name: text, label: Text, widget: string, required: true }
                  - { name: url, label: URL, widget: string, required: true }
                  - {
                      name: path,
                      label: Active Path,
                      widget: string,
                      required: false,
                      hint: "Page slug used to highlight the current link.",
                    }
                  - {
                      name: new_tab,
                      label: Open in a new tab,
                      widget: boolean,
                      default: false,
                    }
                  - {
                      name: type,
                      label: Button Type,
                      widget: select,
                      options:
                        [
                          "primary",
                          "secondary",
                          "outline",
                          "text",
                          "underline",
                        ],
                      default: "text",
                      multiple: false,
                      create: false,
                      required: false,
