          - name: cta_2
            label: Secondary Call To Action
            widget: object
            summary: "{{ fields.text }} → {{ fields.url }}"
            required: false
            fields: *header_cta_fields
          - name: lock_body_scroll
            label: Lock Page Scroll When Menu Is Open
            widget: boolean
            default: true
            required: false
            hint: Stops the page behind the mobile menu from scrolling.
          - name: nav_btn
            label: Mobile Menu Button
            widget: object
            required: false
            fields:
              - name: text
                label: Button Text
                widget: string
                required: false
                hint: Optional label shown next to the icon.
              - name: symbol
                label: Icon Style
                widget: select
                multiple: false
                required: false
                default: burger
                options: [burger, chocolate, kebab]
              - name: shape
                label: Icon Shape
                widget: select
                multiple: false
                required: false
                default: square
                options: [square, round]
          - name: nav_footer
            label: Mobile Menu Footer
            widget: object
            required: false
            fields:
              - name: links
                label: Links
                label_singular: Link
                widget: list
                required: false
                fields:
                  - { name: text, label: Text, widget: string, required: true }
                  - { name: url, label: URL, widget: string, required: true }
                  - {
                      name: new_tab,
                      label: Open in a new tab,
                      widget: boolean,
                      default: false,
                    }
              - name: social_media
                label: Show Social Media Links
                widget: boolean
                default: true
                required: false
              - name: admin_login
                label: Show Admin Login Link
                widget: boolean
                default: true
                required: false
      - name: footer_simple
