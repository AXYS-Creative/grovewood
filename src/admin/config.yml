backend:
  # Use netlify identity as backend
  name: git-gateway
  branch: main
  repo: "https://github.com/AXYS-Creative/grovewood.git"
media_folder: src/static/img
public_folder: /static/img
site_url: https://grovewood.netlify.app # On admin login page, this adds a 'go back to site' link. Also added in the corner when logged in.
display_url: https://grovewood.netlify.app # In admin dashboard, this adds the URL in the corner 'View Live'. Used with 'preview_path' for collection viewing.
logo_url: https://grovewood.netlify.app/static/img/icons/admin-logo.svg # On admin login page, this adds a custom logo.

# Please run "npx netlify-cms-proxy-server" for local backend
local_backend: true
# publish_mode: editorial_workflow
partials:
  shared_cta: &cta_field
    name: cta
    label: Call To Action
    widget: object
    summary: "{{ fields.text }} → {{ fields.url }}"
    required: false
    fields:
      - name: text
        label: Button Text
        widget: string
        required: false
        hint: An empty value removes the button
      - name: text_desc
        label: Button Text Description
        widget: string
        required: false
        hint: >
          Some phrases like 'Learn More' or 'Register' are too vague & hurt site metrics. 
          Add more details to enhance SEO & a11y. This won't show on the button.
      - name: url
        label: Button URL
        widget: string
        required: false
        hint: e.g. '/join' or 'axyscreative.com'. To return home use '/'.
      - name: new_tab
        label: Open in a new tab
        widget: boolean
        default: true
  shared_logo: &logo_field
    name: logo
    label: Logo
    widget: object
    summary: "Site Logo"
    required: false
    fields:
      - name: src_light
        label: Image Source (Light Theme)
        widget: image
        required: false
        hint: An empty value removes the logo
      - name: src_dark
        label: Image Source (Dark Theme)
        widget: image
        required: false
        hint: An empty value removes the logo
      - name: text
        label: Text
        widget: string
        required: false
        hint: Optional image description for SEO and accessibility.
      - name: url
        label: Button URL
        widget: string
        required: false
        hint: Include a url to make the logo a link. To return home use '/'.
      - name: new_tab
        label: Open in a new tab
        widget: boolean
        default: true
        hint: If the logo is a link, this toggles opening in a new tab.
  shared_header_cta: &header_cta_fields
    - {
        name: text,
        label: Button Text,
        widget: string,
        required: false,
        hint: An empty value removes the button.,
      }
    - {
        name: text_desc,
        label: Accessible Description,
        widget: string,
        required: false,
        hint: "Used by screen readers when the visible label is vague (e.g. 'Log In'). This won't show on the button.",
      }
    - {
        name: url,
        label: Button URL,
        widget: string,
        required: false,
        hint: "e.g. '/contact' or 'tel:8017854622'. To return home use '/'.",
      }
    - {
        name: new_tab,
        label: Open in a new tab,
        widget: boolean,
        default: true,
      }
    - {
        name: type,
        label: Button Type,
        widget: select,
        options: ["primary", "secondary", "outline", "text", "underline"],
        default: "text",
        multiple: false,
        create: false,
        required: false,
      }
    - { name: icon_start, label: Start Icon, widget: image, required: false }
    - { name: icon_end, label: End Icon, widget: image, required: false }
    - {
        name: class,
        label: CSS Class,
        widget: hidden,
        default: "btn--split-text",
      }
  shared_section_cta: &section_cta_fields
    - {
        name: text,
        label: Button Text,
        widget: string,
        required: false,
        hint: An empty value removes the button.,
      }
    - {
        name: text_desc,
        label: Accessible Description,
        widget: string,
        required: false,
        hint: "Used by screen readers when the visible label is vague. This won't show on the button.",
      }
    - {
        name: url,
        label: Button URL,
        widget: string,
        required: false,
        hint: "e.g. '/contact' or 'tel:8017854622'. To return home use '/'.",
      }
    - {
        name: new_tab,
        label: Open in a new tab,
        widget: boolean,
        default: false,
      }
    - {
        name: type,
        label: Button Type,
        widget: select,
        options: ["primary", "secondary", "outline", "text", "underline"],
        default: "primary",
        multiple: false,
        create: false,
        required: false,
      }
    - { name: icon_start, label: Start Icon, widget: image, required: false }
    - { name: icon_end, label: End Icon, widget: image, required: false }
  shared_footer_contact: &footer_contact_fields
    - {
        name: text,
        label: Text,
        widget: string,
        required: false,
        hint: "Use [%br%] to force a line break.",
      }
    - { name: url, label: URL, widget: string, required: false }
    - {
        name: new_tab,
        label: Open in a new tab,
        widget: boolean,
        default: false,
      }
    - {
        name: type,
        label: Button Type,
        widget: select,
        options: ["primary", "secondary", "outline", "text", "underline"],
        default: "text",
        multiple: false,
        create: false,
        required: false,
      }
    - {
        name: class,
        label: CSS Class,
        widget: hidden,
        default: "footer-simple__top-contact-link",
      }
  shared_footer_linkset: &footer_linkset_fields
    - { name: text, label: Text, widget: string, required: true }
    - { name: url, label: URL, widget: string, required: true }
    - {
        name: new_tab,
        label: Open in a new tab,
        widget: boolean,
        default: false,
      }
    - {
        name: type,
        label: Button Type,
        widget: select,
        options: ["primary", "secondary", "outline", "text", "underline"],
        default: "text",
        multiple: false,
        create: false,
        required: false,
      }
    - {
        name: class,
        label: CSS Class,
        widget: hidden,
        default: "btn--split-text",
      }
collections:
  - name: page_home
    label: Page - Home
    # description:
    files:
      - name: home_hero
        label: Section - Hero
        file: src/_data/page_home/home_hero.yaml
        preview_path: "/#{{fields.section_id}}"
        editor:
          preview: true
        fields:
          - name: toggle_section
            label: Show Section
            widget: boolean
            default: true
            required: false
          - name: eyebrow
            label: Eyebrow
            widget: string
            required: false
            hint: Small line of text shown above the title.
          - name: title
            label: Title
            widget: string
            required: true
          - name: desc
            label: Description
            widget: text
            required: false
          - name: direction
            label: Layout Direction
            widget: select
            options: ["row", "column"]
            default: "row"
            multiple: false
            required: false
            hint: "'row' places the image beside the text; 'column' stacks them."
          - name: cta_1
            label: Primary Call To Action
            widget: object
            summary: "{{ fields.text }} → {{ fields.url }}"
            required: false
            fields: *section_cta_fields
          - name: cta_2
            label: Secondary Call To Action
            widget: object
            summary: "{{ fields.text }} → {{ fields.url }}"
            required: false
            fields: *section_cta_fields
          - name: extra_hero_img
            label: Hero Image
            widget: object
            required: false
            hint: Shown beside the text. Remove the source to hide the image.
            fields:
              - {
                  name: src,
                  label: Image Source,
                  widget: image,
                  required: false,
                }
              - {
                  name: alt,
                  label: Alt Text,
                  widget: string,
                  required: false,
                  hint: "Leave blank if the image is decorative.",
                }
          - {
              name: section_id,
              label: Section ID,
              widget: hidden,
              default: "home-hero",
            }
      - name: home_text_stack
