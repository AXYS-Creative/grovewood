                widget: image
                required: true
  - name: meta_data
    label: Meta Data
    description: >
      Meta data includes important information used by search engines and
      social platforms, such as your site title, description, keywords, and
      preview images. Updating these settings can improve SEO and control
      how your content appears when shared online.
    files:
      - name: meta_data
        label: Meta Data
        file: src/_data/meta_data.yaml
        editor:
          preview: false
        fields:
          - name: site_name
            label: Site Name
            widget: string
            required: true
            hint: Sample Business Co. This auto appears in the footer copyright text.
          - name: url
            label: URL
            widget: string
            required: true
            hint: Full URL to your site. Don't include an end slash '/'
          - name: author
            label: Author
            widget: string
            required: true
            hint: Person or company name
          - name: contact_email
            label: Contact Email
            widget: string
            required: true
            hint: Email address for rich results schema
          - name: theme_color
            label: Theme Color
            widget: color
            required: true
            hint: Hex code for overflow color on some devices
          - name: favicon_light_theme
            label: Favicon (Light Theme)
            widget: image
            default: "https://CHANGE-ME.com/static/img/favicon-dark.svg"
            required: true
            hint: Shown in browser tab and search engine results.
            media_library:
              config:
                max_file_size: 500000 # 1MB = 1,000,000 bytes
          - name: favicon_dark_theme
            label: Favicon (Dark Theme)
            widget: image
            default: "https://CHANGE-ME.com/static/img/favicon-light.svg"
            required: true
            hint: Shown in browser tab and search engine results.
            media_library:
              config:
                max_file_size: 500000 # 1MB = 1,000,000 bytes
          - name: defaults
            label: Defaults
            widget: object
            collapsed: true
            required: true
            hint: Default meta data for pages without specific settings
            fields:
              - name: title
                label: Page Title (Default)
                widget: string
                required: true
                hint: Shown in browser tab and search engine results. Keep it under 60 characters.
              - name: description
                label: Page Description (Default)
                widget: text
                required: true
                hint: Short page summary for SEO and social media. Keep it around 140–160 characters.
              - name: crawl_page
                label: Crawl Page (Default)
                widget: boolean
                required: false
                hint: "Uncheck to add 'noindex, nofollow' meta tag"
              - name: og_image
                label: Open Graph Image (Default)
                widget: image
                required: true
                hint: Default image for social sharing (See 'page details' below to override per page)
                media_library:
                  config:
                    max_file_size: 8000000
          - name: page_details
            label: Page Details
            allow_add: false
            widget: list
            required: true
            hint: Page specific meta data, used for SEO and social sharing
            fields:
              - name: label
                label: Label (Admin Dashboard)
                widget: string
                required: false
                hint: Dashboard label only — Do not edit this field
              - name: title
                label: Page Title
                widget: string
                required: false
                hint: Shown in browser tab and search engine results. Keep it under 60 characters.
              - name: description
                label: Page Description
                widget: text
                required: false
                hint: Short page summary for SEO and social media. Keep it around 140–160 characters.
              - name: og_image
                label: Open Graph Image
                widget: image
                required: false
                hint: Image for social sharing. If not set, the default image will be used. (see 'defaults' above)
                media_library:
                  config:
                    max_file_size: 8000000
              - name: crawl_page
                label: Crawl Page (Robots)
                widget: boolean
                required: false
                hint: "Uncheck to add 'noindex, nofollow' meta tag"
