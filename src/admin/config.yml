            label: Menu Links
            label_singular: Link
            widget: list
            required: false
            summary: "{{ fields.text }}"
            fields:
              - { name: text, label: Text, widget: string, required: true }
              - {
                  name: url,
                  label: URL,
                  widget: string,
                  required: false,
                  hint: Leave blank if this item only opens a dropdown.,
                }
              - {
                  name: path,
                  label: Active Path,
                  widget: string,
                  required: false,
                  hint: "Page slug used to highlight the current link, e.g. 'team'.",
                }
              - {
                  name: new_tab,
                  label: Open in a new tab,
                  widget: boolean,
                  default: false,
                }
              - {
                  name: type,
                  label: Button Type,
                  widget: select,
                  options:
                    ["primary", "secondary", "outline", "text", "underline"],
                  default: "text",
                  multiple: false,
