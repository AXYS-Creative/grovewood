            required: false
          - name: address
            label: Address
            widget: object
            required: false
            summary: "{{ fields.text }}"
            fields: *footer_contact_fields
          - name: phone
            label: Phone
            widget: object
            required: false
            summary: "{{ fields.text }}"
            fields: *footer_contact_fields
          - name: email
            label: Email
            widget: object
            required: false
            summary: "{{ fields.text }}"
            fields: *footer_contact_fields
          - name: social_media
            label: Show Social Media
            widget: boolean
            default: true
            required: false
            hint: Renders the shared social media links (see the Social Media file).
          - name: linkset_1_title
            label: Link Set 1 — Title
            widget: string
            required: false
          - name: linkset_1
            label: Link Set 1
            label_singular: Link
            widget: list
            required: false
            fields: *footer_linkset_fields
          - name: linkset_2_title
            label: Link Set 2 — Title
            widget: string
            required: false
          - name: linkset_2
            label: Link Set 2
            label_singular: Link
            widget: list
            required: false
            fields: *footer_linkset_fields
          - name: linkset_3_title
            label: Link Set 3 — Title
            widget: string
            required: false
          - name: linkset_3
            label: Link Set 3
            label_singular: Link
            widget: list
            required: false
            fields: *footer_linkset_fields
          - name: include_bottom
            label: Include Bottom Section
            widget: boolean
            default: true
            required: false
            hint: Toggles the lower area (copyright, legal links, theme toggle).
          - name: divider
            label: Divider
            widget: boolean
            default: true
            required: false
            hint: Shows a horizontal rule between the top and bottom sections.
          - name: divider_width_full
            label: Full-Width Divider
            widget: boolean
            default: false
            required: false
          - name: return_to_top
            label: Return To Top Button
            widget: object
            required: false
            summary: "{{ fields.text }}"
            fields:
              - {
                  name: text,
                  label: Text,
                  widget: string,
                  required: false,
                  hint: "An empty value removes the button.",
                }
              # URL is intentionally hidden — this button always scrolls to the
              # top of the page (handled by the 'back-to-top' JS hook), so a URL
              # here would have no effect.
              - { name: url, label: URL, widget: hidden, default: "" }
              - {
                  name: type,
                  label: Button Type,
                  widget: select,
                  options: ["text", "underline", "primary", "secondary"],
                  default: "underline",
                  multiple: false,
                  create: false,
                  required: false,
                }
              - {
                  name: class,
                  label: CSS Class,
                  widget: hidden,
                  default: "back-to-top btn--split-text",
                }
