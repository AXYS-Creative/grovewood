            required: false
            hint: Leave blank to use the default “© <year> <site name>. All rights reserved”.
          - name: legal_links
            label: Legal Links
            label_singular: Link
            widget: list
            required: false
            fields:
              - { name: text, label: Text, widget: string, required: true }
              - { name: url, label: URL, widget: string, required: true }
              - {
                  name: type,
                  label: Button Type,
                  widget: select,
                  options: ["text", "underline", "primary", "secondary"],
                  default: "text",
                  multiple: false,
                  create: false,
                  required: false,
                }
              - {
                  name: class,
                  label: CSS Class,
                  widget: hidden,
                  default: "btn--split-text",
                }
      - name: social_media
