            widget: list
            required: false
            fields: *footer_linkset_fields
          - name: linkset_2_title
            label: Link Set 2 — Title
            widget: string
            required: false
          - name: linkset_2
            label: Link Set 2
            label_singular: Link
            widget: list
            required: false
