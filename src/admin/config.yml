      - name: home_carousel_testimonial
        label: Section - Testimonial Carousel
        file: src/_data/page_home/home_carousel_testimonial.yaml
        preview_path: "/#{{fields.section_id}}"
        editor:
          preview: true
        fields:
          - name: toggle_section
            label: Show Section
            widget: boolean
            default: true
            required: false
          - name: eyebrow
            label: Eyebrow
            widget: string
            required: false
            hint: Small line of text shown above the title.
          - name: title
            label: Title
            widget: string
            required: false
          - name: carousel
            label: Carousel
            widget: object
            required: false
            fields:
              - name: pagination
                label: Pagination Style
                widget: select
                options: ["arrows", "dots", "none"]
                default: "arrows"
                multiple: false
                required: false
              - name: drag
                label: Allow Click / Touch Drag
                widget: boolean
                default: true
                required: false
              - name: drag_threshold
                label: Drag Threshold
                widget: number
                value_type: float
                default: 0.5
                required: false
                hint: "Fraction (0-1) of a slide's width the drag must cross before it commits to the next/prev slide. Lower = easier to trigger a slide change."
              - name: slides
                label: Slides
                label_singular: Slide
                widget: list
                required: false
                summary: "{{ fields.name }}"
                fields:
                  - { name: quote, label: Quote, widget: text, required: true }
                  - { name: name, label: Name, widget: string, required: false }
                  - {
                      name: title,
                      label: Title / Role,
                      widget: string,
                      required: false,
                    }
                  - name: img
                    label: Portrait
                    widget: object
                    required: false
                    fields:
                      - {
                          name: src,
                          label: Image Source,
                          widget: image,
                          required: false,
                        }
                      - {
                          name: alt,
                          label: Alt Text,
                          widget: string,
                          required: false,
                          hint: "Leave blank if the image is decorative.",
                        }
          - {
              name: class,
              label: CSS Class,
              widget: hidden,
              default: "home-testimonials",
            }
          - {
              name: section_id,
              label: Section ID,
              widget: hidden,
              default: "home-testimonials",
            }
      - name: home_stats
        label: Section - Stats
        file: src/_data/page_home/home_stats.yaml
        preview_path: "/#{{fields.section_id}}"
        editor:
          preview: true
        fields:
          - name: toggle_section
            label: Show Section
            widget: boolean
            default: true
            required: false
          - name: eyebrow
            label: Eyebrow
            widget: string
            required: false
            hint: Small line of text shown above the title.
          - name: title
            label: Title
            widget: string
            required: false
          - name: desc
            label: Description
            widget: text
            required: false
          - name: stats
            label: Stats
            label_singular: Stat
            widget: list
            required: false
            summary: "{{ fields.digit }}{{ fields.suffix }} — {{ fields.label }}"
            fields:
              - {
                  name: digit,
                  label: Number,
                  widget: number,
                  value_type: int,
                  required: true,
                }
              - {
                  name: suffix,
                  label: Suffix,
                  widget: string,
                  required: false,
                  hint: "e.g. 'k+', '%', '+'.",
                }
              - { name: label, label: Label, widget: string, required: false }
              - {
                  name: spoken_label,
                  label: Screen Reader Label,
                  widget: string,
                  required: false,
                  hint: "Full sentence read aloud in place of the number, e.g. 'Over 15 thousand in monthly revenue'.",
                }
              - {
                  name: ticker,
                  label: Ticker Animation,
                  widget: boolean,
                  default: true,
                  hint: Changes the counting animation to appear more analog.,
                }
              - {
                  name: class,
                  label: CSS Class,
                  widget: hidden,
                  default: "home-stats__counter",
                }
          - {
              name: class,
              label: CSS Class,
              widget: hidden,
              default: "home-stats",
            }
          - {
              name: section_id,
              label: Section ID,
              widget: hidden,
              default: "home-stats",
            }
