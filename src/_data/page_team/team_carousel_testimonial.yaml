    - quote: >-
        After months of trying different approaches, TMS at Grovewood was the first thing that actually shifted things. The staff was straightforward and supportive throughout.
      name: Megan Foster
      title: MEDICATION MANAGEMENT PATIENT
      img:
        src: "/static/img/portrait-megan-foster.webp"
        alt: "Megan Foster"
    - quote: >-
        I was nervous about starting therapy, but the psychologist here made the whole process feel manageable and professional. No fluff, just honest, effective care.
      name: Jordan Ruiz
      title: TALK THERAPY PATIENT
      img:
        src: "/static/img/portrait-jordan-ruiz.webp"
        alt: "Jordan Ruiz"
