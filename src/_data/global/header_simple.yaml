show_skip_to_content: true

# logo.njk
logo: true

# menu-links.njk
menu_links:
  - text: Home
    url: "/"
    path: "home"
    new_tab: false
    type: text
    class: menu-links__link btn--split-text
  - text: Services
    icon: "/static/img/icon-chevron-down.svg"
    trigger_text_class: menu-links__link btn--split-text btn--text
    inner_links:
      - text: Talk Therapy
        url: "/talk-therapy"
        path: "talk-therapy"
        new_tab: false
        type: text
        icon_start: /static/img/icon-communication.svg
        class: btn--split-text
      - text: Medication Management
        url: "/medication-management"
        path: "medication-management"
        new_tab: false
        type: text
        icon_start: /static/img/icon-pill.svg
        class: btn--split-text
      - text: NeuroStar TMS
        url: "/neurostar-tms"
        path: "neurostar-tms"
        new_tab: false
        type: text
        icon_start: /static/img/icon-neurostar.svg
        class: btn--split-text
      - text: Assessment
        url: "/assessment"
        path: "assessment"
        new_tab: false
        type: text
        icon_start: /static/img/icon-inventory.svg
        class: btn--split-text
  - text: Team
    url: "/team"
    path: "team"
    new_tab: false
    type: text
    class: menu-links__link btn--split-text

link_placement: center # start | center | end

cta_1:
  text: Call (801) 785-4622
  text_desc: Call us to schedule an appointment
  url: tel:8017854622
  new_tab: true
  type: primary # visit _btn.scss for all types
  class: btn--split-text magnet
  icon_start: /static/img/icon-phone.svg
  attributes: data-magnet-x="0.12" data-magnet-y="0.48" data-magnet-return-ease="cubic-bezier(0,1.64,.63,1.92)"

cta_2:
  text: Admin Log In
  # text_desc:
  url: /admin
  icon_end: ""
  new_tab: true
  type: text
  class: btn--split-text

# mobile nav specific content
lock_body_scroll: true # nav.njk Locks body scroll when nav is open

nav_btn:
  text: menu
  symbol: burger # burger | chocolate | kebab
  shape: square # square | round
  # display: md # Dev use only

nav_footer:
  links:
    - text: Call (801)785-4622
      url: tel:8017854622
      new_tab: false
      type: primary
      class: btn--split-text
  #   - text: Terms of Service
  #     url: "/terms-of-service"
  #     new_tab: false
  #     class: btn--split-text
  # admin_login: true
  social_media: true
