class: "talk-therapy-hero"
section_id: talk-therapy-hero # anchor target for the admin "view live" link
direction: row # row | column (column is default, mobile first)

toggle_section: true
eyebrow: WHY TALK THERAPY FROM GROVEWOOD MENTAL HEALTH?
title: Since 2009, we've helped thousands along the Wasatch Front get the change they wanted
desc: >-
  Grovewood Mental Health (formerly known as Giles & Associates Family Psychology) was formed in 2009. Since then we've helped thousands of individuals, couples, families, and teens all along the Wasatch Front. We take our role as a change agent very seriously and are honored to be trusted by so many.

