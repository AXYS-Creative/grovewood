class: "medication-management-carousel-full"
section_id: medication-management-carousel-full # anchor target for the admin "view live" link

toggle_section: true
eyebrow: MEDICATION BENEFITS
title: Personalized medication plans with measurable outcomes

# Remember, you don't need to expose all available configs to the admin, some can be reserved for dev use.
cta_1:
  text: Email us
  text_desc: Send us an email
  url: mailto:info@grovewoodutah.com
  new_tab: true
  icon_start: "/static/img/icon-mail.svg"
  # type: primary
# cta_2:
#   text: Email us
#   text_desc: Send us an email
#   url: mailto:info@grovewoodutah.com
#   new_tab: true
#   type: secondary

# Carousel behaviour (pagination, align, loop, autoplay, drag) defaults to
# global.carousel_full (src/_data/global/carousel_full.yaml). This section only
# overrides drag_threshold, so override_defaults + custom are used for that.
carousel:
  override_defaults: true
  custom:
    drag_threshold: 0.2
  slides:
    - title: Symptom reduction protocol
      desc: >-
        Targeted medication to reduce symptoms like anxiety, depression, or insomnia within weeks.
      img:
        src: "/static/img/medication-management-carousel-1.webp"
        alt: ""
    - title: Combined therapy approach
      desc: >-
        Medication paired with talk therapy for better long-term results than either alone.
      img:
        src: "/static/img/medication-management-carousel-2.webp"
        alt: ""
    - title: Side effect monitoring
      desc: >-
        We track and adjust dosage to minimize side effects and keep treatment comfortable.
      img:
        src: "/static/img/medication-management-carousel-3.webp"
        alt: ""
    - title: Monthly check-ins included
      desc: >-
        Regular follow-ups to assess progress, adjust dosages, and keep your plan on track.
      img:
        src: "/static/img/medication-management-carousel-4.webp"
        alt: ""
