eyebrow: PATIENT SUCCESS
title: Over 200 patients have found the right medication fit

# Carousel behaviour (pagination, loop, autoplay, drag, drag_threshold) comes from
# global.carousel_testimonial (src/_data/global/carousel_testimonial.yaml).
carousel:
  override_defaults: false

  slides:
    - quote: >-
        The medication management at Grovewood was exactly what I needed. They adjusted my dosage slowly and explained every change. For the first time in years, I feel stable.
