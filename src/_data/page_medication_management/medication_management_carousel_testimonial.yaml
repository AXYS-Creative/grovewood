        src: "/static/img/portrait-emily-r.webp"
        alt: "Emily R."
    - quote: >-
        I was nervous about starting medication, but the team walked me through the whole process. No pressure, no rush. Just clear answers and a plan that actually worked.
      name: David K.
      title: PATIENT SINCE 2024
      img:
        src: "/static/img/portrait-david-k.webp"
        alt: "David K."
    - quote: >-
        After months of trial and error with other clinics, Grovewood got my medication right on the first attempt. Their assessment was thorough and the follow-up has been consistent.
      name: Jennifer L.
      title: PATIENT SINCE 2023
      img:
        src: "/static/img/portrait-jennifer-l.webp"
        alt: "Jennifer L."
