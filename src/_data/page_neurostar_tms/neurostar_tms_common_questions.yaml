  items:
    - title: Does TMS hurt?
      content: >-
        You will feel a tapping sensation on your scalp during the session. Most patients find it tolerable, and any discomfort typically fades within the first few treatments.
    - title: How long does a single TMS session take?
      content: >-
        Each session lasts about 20 minutes. You sit in a chair and a magnetic coil is placed against your head. You can drive yourself home afterward.
    - title: How many sessions will I need?
      content: >-
        A standard course is 36 sessions, typically once daily, five days a week. Your clinician will create a schedule that fits your needs and monitor progress throughout.
    - title: Will TMS interfere with my medications?
      content: >-
        TMS is often used alongside medication. It does not interact with most drugs, but we review your full history during the initial assessment to make sure it is a safe fit.
    - title: Does insurance cover TMS?
      content: >-
        Many major insurers cover TMS for treatment-resistant depression. Our team can verify your benefits before you start and walk you through any out-of-pocket costs.
