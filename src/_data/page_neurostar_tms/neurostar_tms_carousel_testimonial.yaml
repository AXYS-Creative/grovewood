    - quote: >-
        I was skeptical about TMS at first. But after two weeks, I noticed I was sleeping better. After a month, I had more energy to get through the day without the fog.
      name: Jordan K.
      title: COMPLETED FULL TMS PROTOCOL
      img:
        src: "/static/img/portrait-jordan-k.webp"
        alt: "Jordan K."
    - quote: >-
        I'd tried four different medications and therapy without lasting results. TMS was the first intervention that actually shifted the baseline. It made everything else easier.
      name: Elena V.
      title: STARTED TMS AFTER MEDICATION-RESISTANCE DEPRESSION DIAGNOSIS
      img:
        src: "/static/img/portrait-elena-vasquez.webp"
        alt: "Elena V."
