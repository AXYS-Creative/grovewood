  items:
    - title: How long does a psychological assessment take?
      content: >-
        Most assessments are completed over two to three sessions, depending on the referral question. Each session typically lasts 60 to 90 minutes. We schedule at a pace that works for you.
    - title: What conditions or concerns can an assessment diagnose?
      content: >-
        We assess for ADHD, learning disorders, mood and anxiety conditions, and personality functioning, among other clinical concerns. The specific focus depends on what you and your referring provider want to clarify.
    - title: Do I need a referral from a doctor?
      content: >-
        No. You can schedule directly. That said, some insurance plans may require a referral, so checking with your provider beforehand is a good idea.
    - title: Will my insurance cover the assessment?
      content: >-
        Coverage varies by plan. We recommend calling your insurance company and asking about out-of-network psychological testing benefits. We can provide the documentation you need to submit a claim.
    - title: What do I get at the end of the process?
      content: >-
        You receive a detailed written report with diagnostic findings, test results, and specific recommendations. We also offer a feedback session where we walk through the results and answer your questions.
    - title: Do you work with children and adolescents?
      content: >-
        Yes. We conduct assessments for children, adolescents, and adults. For minors, we involve parents in the intake and feedback process to make sure recommendations fit the family context.
