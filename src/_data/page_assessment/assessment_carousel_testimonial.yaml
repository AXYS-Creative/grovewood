class: "assessment-testimonials"
section_id: assessment-testimonials # anchor target for the admin "view live" link

toggle_section: true
eyebrow: PATIENT RESULTS
title: See what assessment outcomes look like

desc: >-
  Ask around before you spend money on a psychological evaluation. Here's what our patients have to say about their experience.

# Carousel behaviour (pagination, drag, drag_threshold) comes from
# global.carousel_testimonial (src/_data/global/carousel_testimonial.yaml).
carousel:
  override_defaults: false
  slides:
    - quote: >-
        The assessment was thorough and the feedback session was incredibly helpful. For the first time, I felt like someone actually understood the full picture of what I've been dealing with.
      name: Emily G.
      title: ASSESSMENT PATIENT, PLEASANT GROVE
      img:
        src: "/static/img/portrait-emily-g.webp"
        alt: "Emily G."
    - quote: >-
        I came in looking for clarity and left with a detailed report that actually changed how my therapist approaches my treatment. That kind of specificity makes all the difference.
      name: James T.
      title: ASSESSMENT PATIENT, UTAH COUNTY
      img:
        src: "/static/img/portrait-james-t.webp"
        alt: "James T."
    - quote: >-
        The diagnostic testing here is on another level. The clinician explained every step and connected my results directly to a treatment plan. No guesswork, just solid clinical reasoning.
      name: Sarah K.
      title: ASSESSMENT PATIENT, PLEASANT GROVE
      img:
        src: "/static/img/portrait-sarah-k.webp"
        alt: "Sarah K."
