# Image Fan
# arc        -> degrees the fan wraps: 0 = flat row, 90 = quarter circle,
#               180 = semicircle, 360 = full ring
# gap        -> spacing between cards as a multiple of card width
#               (1 = edges touching, >1 = space between, <1 = overlap)
# closed     -> true = spread evenly around a full 360 ring (ignores `arc`)
# direction  -> up (rainbow, middle card highest) | down (valley)
# item_width -> card width as a % of the component's own width (22 = 22%);
#               the whole fan scales with its parent container
# stack      -> sequence (stack in array order) | pyramid (centre card on top,
#               stepping down symmetrically to the first and last)
# animate_in -> true = reveal on scroll into view (wires up the `gsap-animate`
#               util). sequence: cards rise + fade in, staggered by array order.
#               pyramid: the fan starts collapsed onto the centre card, then
#               opens one ring at a time — centre card drops and settles back,
#               then each pair of side cards fans out along the arc after the
#               last (tune with the `--fan-in-rise` / `--fan-open-*` props)
# chop     -> px each ring drops below the one inside it, outward from the
#               centre — 12 drops the 2nd/4th cards 12px, the 1st/5th 24px, etc.
#               Defaults to 0 (clean arc)

arc: 40
gap: 0.8
closed: false
chop: 16
direction: up
item_width: 20
stack: pyramid
animate_in: true
